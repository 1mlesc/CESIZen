name: CI — CESIZEN

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefix my-app --legacy-peer-deps
      - run: npm run lint
        continue-on-error: true

  tests:
    name: Tests unitaires (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        node: [20, 22]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.node }}
          path: coverage/
          retention-days: 7

  security:
    name: Audit Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --prefix my-app --legacy-peer-deps
      - run: npm audit --audit-level=high --prefix my-app || true
