services:
  app:
    image: node:22-alpine
    container_name: cesizen_app_dev
    working_dir: /app
    # On force l'installation malgré les conflits de peer dependencies (Next 16 vs NextAuth v5)
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npm run dev"
    env_file:
      - ./my-app/.env
    volumes:
      - ./my-app:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
    # Ajout de la machine hôte pour postgreSQL héberger en local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cesizen_network

networks:
  cesizen_network:
    driver: bridge
